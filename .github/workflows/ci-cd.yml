name: MediBook CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests & Quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: medibook_test
          MYSQL_USER: medibook_user
          MYSQL_PASSWORD: medibook_test_pass
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: 1
          MYSQL_DATABASE: medibook_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test_root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: 1
          MYSQL_DATABASE: medibook_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test_root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py test --verbosity=2

      - name: Check for missing migrations
        env:
          SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: 1
          MYSQL_DATABASE: medibook_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test_root
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py migrate --check

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/medibook:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/medibook:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed successfully ✅"