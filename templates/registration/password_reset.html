{% extends 'base.html' %}
{% block title %}Réinitialiser le mot de passe{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 68px);background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:440px">

    <div style="text-align:center;margin-bottom:2rem">
      <div style="width:64px;height:64px;background:rgba(0,181,163,0.15);border:2px solid rgba(0,181,163,0.3);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.75rem;margin:0 auto 1rem">🔑</div>
      <h1 style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:white">Mot de passe oublié ?</h1>
      <p style="color:rgba(255,255,255,0.5);margin-top:0.5rem">Entrez votre email, nous vous enverrons un lien de réinitialisation.</p>
    </div>

    <div style="background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2.5rem">
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" style="color:rgba(255,255,255,0.8)">Adresse email</label>
          <input type="email" name="email" required
                 class="form-input"
                 style="background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15);color:white"
                 placeholder="votre@email.com"
                 autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">
          <i class="fas fa-paper-plane"></i> Envoyer le lien
        </button>
      </form>
      <div style="text-align:center;margin-top:1.5rem;color:rgba(255,255,255,0.4);font-size:0.875rem">
        Vous vous souvenez ?
        <a href="{% url 'accounts:login' %}" style="color:var(--teal);text-decoration:none;font-weight:600"> Se connecter</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
