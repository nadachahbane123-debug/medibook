{% extends 'base.html' %}
{% block title %}Mot de passe modifié{% endblock %}
{% block content %}
<section class="section section-gray">
  <div style="max-width:480px;margin:0 auto">
    <div class="form-card" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:1rem">✅</div>
      <h2 style="font-family:'Syne',sans-serif;font-weight:700;color:var(--navy);margin-bottom:0.5rem">
        Mot de passe modifié !
      </h2>
      <p style="color:var(--gray-500);margin-bottom:1.5rem">
        Votre mot de passe a été changé avec succès.
      </p>
      <a href="{% url 'accounts:profile' %}" class="btn btn-primary" style="justify-content:center">
        Retour au profil
      </a>
    </div>
  </div>
</section>
{% endblock %}
