{% extends 'base.html' %}
{% block title %}Changer mon mot de passe{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-header-container">
    <h1 class="page-header-title">Changer mon mot de passe</h1>
  </div>
</div>
<section class="section section-gray">
  <div style="max-width:480px;margin:0 auto">
    <div class="form-card">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <span class="form-error">{{ field.errors|first }}</span>
          {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
          <i class="fas fa-lock"></i> Changer le mot de passe
        </button>
        <a href="{% url 'accounts:profile' %}" style="display:block;text-align:center;margin-top:1rem;color:var(--gray-500);font-size:0.875rem">
          Annuler
        </a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
