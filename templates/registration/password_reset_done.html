{% extends 'base.html' %}
{% block title %}Email envoyé{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 68px);background:linear-gradient(135deg,var(--navy) 0%,var(--navy-light) 100%);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:440px;text-align:center">
    <div style="width:80px;height:80px;background:rgba(16,185,129,0.15);border:2px solid rgba(16,185,129,0.4);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1.5rem">📬</div>
    <h1 style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;color:white;margin-bottom:1rem">Email envoyé !</h1>
    <p style="color:rgba(255,255,255,0.55);line-height:1.8;margin-bottom:2rem">
      Si cette adresse email est associée à un compte MediBook, vous recevrez un lien de réinitialisation dans quelques minutes.<br><br>
      <span style="font-size:0.85rem;color:rgba(255,255,255,0.35)">Vérifiez aussi vos spams.</span>
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="display:inline-flex">
      <i class="fas fa-arrow-left"></i> Retour à la connexion
    </a>
  </div>
</div>
{% endblock %}
