<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur serveur — MediBook</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0a1628; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; }
    .big-number { font-family: 'Syne', sans-serif; font-size: clamp(8rem, 20vw, 14rem); font-weight: 800; line-height: 1; background: linear-gradient(135deg, #ef4444, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    .icon { font-size: 4rem; margin-bottom: 1rem; display: block; }
    h1 { font-family: 'Syne', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 1rem; }
    p { color: rgba(255,255,255,0.55); font-size: 1.05rem; line-height: 1.7; max-width: 420px; margin: 0 auto 2.5rem; }
    .btn-primary { background: #00b5a3; color: #0a1628; padding: 0.85rem 2rem; border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none; transition: all 0.2s; display: inline-block; }
    .btn-primary:hover { background: #00d4bf; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">⚙️</span>
    <div class="big-number">500</div>
    <h1>Erreur serveur</h1>
    <p>Une erreur interne s'est produite. Notre équipe technique a été notifiée et travaille à résoudre le problème.</p>
    <a href="/" class="btn-primary">⚕ Retour à l'accueil</a>
  </div>
</body>
</html>
