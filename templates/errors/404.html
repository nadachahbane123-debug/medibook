<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — MediBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a1628;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container { text-align: center; padding: 2rem; position: relative; z-index: 1; }
    .big-number {
      font-family: 'Syne', sans-serif;
      font-size: clamp(8rem, 20vw, 14rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #00b5a3, #00d4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .icon { font-size: 4rem; margin-bottom: 1rem; display: block; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2rem; font-weight: 800;
      margin-bottom: 1rem;
    }
    p {
      color: rgba(255,255,255,0.55);
      font-size: 1.05rem; line-height: 1.7;
      max-width: 420px; margin: 0 auto 2.5rem;
    }
    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: #00b5a3; color: #0a1628;
      padding: 0.85rem 2rem; border-radius: 12px;
      font-weight: 700; font-size: 1rem; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: #00d4bf; transform: translateY(-2px); }
    .btn-outline {
      border: 1.5px solid rgba(255,255,255,0.2); color: white;
      padding: 0.85rem 2rem; border-radius: 12px;
      font-weight: 500; font-size: 1rem; text-decoration: none;
      transition: all 0.2s;
    }
    .btn-outline:hover { border-color: #00b5a3; color: #00b5a3; }
    /* Background decoration */
    .bg-circle {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle, rgba(0,181,163,0.08), transparent 70%);
      pointer-events: none;
    }
    .bg-circle-1 { width: 600px; height: 600px; top: -150px; right: -150px; }
    .bg-circle-2 { width: 400px; height: 400px; bottom: -100px; left: -100px; }
  </style>
</head>
<body>
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="container">
    <span class="icon">🔍</span>
    <div class="big-number">404</div>
    <h1>Page introuvable</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Pas de panique, notre équipe médicale est toujours disponible !</p>
    <div class="actions">
      <a href="/" class="btn-primary">⚕ Retour à l'accueil</a>
      <a href="/doctors/" class="btn-outline">Trouver un médecin</a>
    </div>
  </div>
</body>
</html>
